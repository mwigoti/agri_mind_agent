{% if page == "login" %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <title>Login - AgriVision</title>
    <style>
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-control {
            height: 48px;
            background: #f5f5f5;
            border: none;
            border-radius: 4px;
            padding: 0.375rem 0.75rem;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }
        .btn-facebook {
            background: #3b5998;
            color: white;
        }
        .btn-google {
            background: #ea4335;
            color: white;
        }
        .forgot-pass {
            color: #888;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .forgot-pass:hover {
            color: #666;
            text-decoration: underline;
        }
        .create-account {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #888;
            text-decoration: none;
        }
        .create-account:hover {
            color: #666;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="d-md-flex half">
        <div class="bg" style="background-image: url('{% static "images/image3.webp" %}');"></div>
        <div class="contents">
            <div class="container">
                <div class="row align-items-center justify-content-center">
                    <div class="col-md-12">
                        <div class="form-block mx-auto">
                            <div class="text-center mb-5">
                                <h3 class="text-uppercase">Login</h3>
                            </div>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                {% endfor %}
                            {% endif %}

                            <form method="post" novalidate>
                                {% csrf_token %}
                                <div class="form-group first">
                                    <label for="email">Email Address</label>
                                    <input type="email" class="form-control" placeholder="your-email@example.com" 
                                           id="email" name="email" required>
                                </div>
                                <div class="form-group last mb-3">
                                    <label for="password">Password</label>
                                    <input type="password" class="form-control" placeholder="Your Password" 
                                           id="password" name="password" required>
                                </div>

                                <div class="d-sm-flex mb-5 align-items-center">
                                    <label class="control control--checkbox mb-3 mb-sm-0">
                                        <span class="caption">Remember me</span>
                                        <input type="checkbox" name="remember_me"/>
                                        <div class="control__indicator"></div>
                                    </label>
                                    <span class="ml-auto">
                                        <a href="#" class="forgot-pass">Forgot Password?</a>
                                    </span>
                                </div>

                                <button type="submit" class="btn btn-block py-2 btn-primary mb-4">Log In</button>

                                <div class="text-center">
                                    <p class="mb-4">or login with</p>
                                    
                                    <a href="#" class="btn social-button btn-facebook btn-block mb-3">
                                        <span class="icon-facebook mr-3"></span> Continue with Facebook
                                    </a>
                                    
                                    <a href="#" class="btn social-button btn-google btn-block">
                                        <span class="icon-google mr-3"></span> Continue with Google
                                    </a>
                                    
                                    <a href="{% url 'register' %}" class="create-account mt-4">
                                        Don't have an account? Create one
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
{% endif %}
