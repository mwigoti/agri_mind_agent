{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Field Analysis</title>
    <link rel="stylesheet" href="{% static 'css/analysis.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        /* This is the CSS you provided, which is well-written and defines the page style. */
        /* It creates the black and green theme. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #e8eaed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2d3748;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 2px 4px rgba(74, 222, 128, 0.3);
        }

        .logo .fa-leaf {
            font-size: 2rem;
            color: #4ade80;
        }

        .analysis-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            align-items: flex-start;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: linear-gradient(135deg, #1a2332, #243447);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #2d3748;
        }

        .card-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d3748;
        }

        .card-header i {
            font-size: 1.5rem;
            color: #4ade80;
            width: 30px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e8eaed;
        }
        
        #result, #recommendation-list {
            padding: 10px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #cbd5e0;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            overflow: auto;
            max-height: 450px;
            position: relative;
        }

        #result.loading {
            background: linear-gradient(90deg, #1a2332 25%, #243447 50%, #1a2332 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            color: #a3e635;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #2d3748;
            border-top: 5px solid #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result.error {
            color: #f87171;
            background: #2d1e1e;
            border: 1px solid #f5c6cb;
        }

        #field-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: #4ade80;
        }

        .info-item h3 {
            font-size: 0.9rem;
            color: #a3e635;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item p {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e8eaed;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .action-btn {
            padding: 15px;
            border-radius: 10px;
            border: none;
            color: #e8eaed;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .download-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .share-btn { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        .charts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chart-wrapper { height: 280px; }

        @media (max-width: 1024px) {
            .analysis-content { grid-template-columns: 1fr; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a2332; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #4a5568, #4ade80); border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <h1>Agri-Vision Analysis</h1>
            </div>
        </header>

        <div class="analysis-content">
            <div class="main-column">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-file-alt"></i>
                        <h2>Analysis</h2>
                    </div>
                    <div id="result" class="loading">
                        <div class="loading-spinner"></div>
                        <p>Running field analysis...</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-lightbulb"></i>
                        <h2>Recommendations</h2>
                    </div>
                    <div id="recommendation-list"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-map-marker-alt"></i>
                        <h2>Field Information</h2>
                    </div>
                    <div id="field-details"></div>
                </div>

                <div class="card">
                     <div class="card-header">
                        <i class="fas fa-chart-pie"></i>
                        <h2>Soil Composition</h2>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="compositionChart"></canvas>
                    </div>
                </div>
                
                <div class="card">
                     <div class="card-header">
                        <i class="fas fa-vial"></i>
                        <h2>Nutrient Levels</h2>
                    </div>
                    <div class="chart-wrapper">
                         <canvas id="nutrientChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-cogs"></i>
                        <h2>Actions</h2>
                    </div>
                    <div class="actions">
                        <button id="download-report" class="action-btn download-btn"><i class="fas fa-download"></i> Download Report</button>
                        <button id="share-report" class="action-btn share-btn"><i class="fas fa-share-alt"></i> Share Report</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store chart instances
let nutrientChart = null;
let compositionChart = null;

// --- Configuration for Charts ---
const chartOptions = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: {
            labels: { color: '#e8eaed', font: { size: 14 } }
        }
    },
    scales: {
        y: {
            ticks: { color: '#cbd5e0', font: { size: 12 } },
            grid: { color: 'rgba(203, 213, 224, 0.1)' }
        },
        x: {
            ticks: { color: '#cbd5e0', font: { size: 12 } },
            grid: { color: 'rgba(203, 213, 224, 0.1)' }
        }
    }
};

// --- Main Logic on Page Load ---
document.addEventListener('DOMContentLoaded', function () {
    // Fetch data asynchronously instead of embedding it directly
    fetch(window.location.pathname, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`Network response was not ok: ${response.statusText}`);
        }
        return response.json();
    })
    .then(data => {
        if (data.success && data.result) {
            // Check if analysis is available
            if (data.result.analysis) {
                populatePage(data.result);
            } else {
                throw new Error('Analysis is not available. Please try again later.');
            }
        } else {
            throw new Error(data.error || 'Failed to retrieve analysis data.');
        }
    })
    .catch(error => {
        console.error("Failed to fetch analysis:", error);
        displayError(error.message);
    });

    setupActionButtons();
});

// --- Helper Functions ---

/**
 * Display text content with fallback
 */
function displayText(element, text, fallback = 'No data available.') {
    if (!element) return;
    
    element.innerHTML = '';
    
    if (text && text.trim()) {
        // Format the text for better readability
        const formattedText = formatAnalysisText(text);
        element.innerHTML = formattedText;
    } else {
        element.innerHTML = `<p style="color: #94a3b8; font-style: italic;">${fallback}</p>`;
    }
}

/**
 * Format analysis text for better display
 */
function formatAnalysisText(text) {
    if (!text) return '';
    
    // Convert markdown-style headers to HTML
    let formatted = text
        .replace(/### (.*?)(\n|$)/g, '<h3 style="color: #4ade80; margin-top: 1rem; margin-bottom: 0.5rem;">$1</h3>')
        .replace(/## (.*?)(\n|$)/g, '<h2 style="color: #4ade80; margin-top: 1.5rem; margin-bottom: 0.75rem;">$2</h2>')
        .replace(/# (.*?)(\n|$)/g, '<h1 style="color: #4ade80; margin-top: 2rem; margin-bottom: 1rem;">$1</h1>');
    
    // Convert **bold** to <strong>
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #a3e635;">$1</strong>');
    
    // Convert bullet points
    formatted = formatted.replace(/^\s*[-*]\s+(.+)$/gm, '<li style="margin-left: 1.5rem; margin-bottom: 0.5rem;">$1</li>');
    
    // Wrap consecutive <li> in <ul>
    formatted = formatted.replace(/(<li[^>]*>.*?<\/li>\s*)+/gs, '<ul style="list-style-type: disc; margin: 0.5rem 0;">$&</ul>');
    
    // Convert numbered lists
    formatted = formatted.replace(/^\s*(\d+)\.\s+(.+)$/gm, '<li style="margin-left: 1.5rem; margin-bottom: 0.5rem;">$2</li>');
    formatted = formatted.replace(/(<li[^>]*>.*?<\/li>\s*)+/gs, function(match) {
        if (match.includes('margin-left')) {
            return '<ol style="list-style-type: decimal; margin: 0.5rem 0;">' + match + '</ol>';
        }
        return match;
    });
    
    // Convert line breaks to <br>
    formatted = formatted.replace(/\n\n/g, '<br><br>');
    formatted = formatted.replace(/\n/g, '<br>');
    
    return formatted;
}

/**
 * Extract recommendations from analysis text
 */
function extractRecommendations(analysisText) {
    if (!analysisText) return '';
    
    const lines = analysisText.split('\n');
    const recommendations = [];
    let inRecommendationsSection = false;
    
    const recommendationIndicators = [
        /^1\.\s*top\s*\d+\s*suitable\s*crops/i,
        /^2\.\s*climate\s*risks/i,
        /^3\.\s*planting\s*timing/i,
        /^4\.\s*irrigation\s*strategy/i,
        /recommendations?:/i,
        /suggested?\s*crops?:/i,
        /best\s*practices?:/i
    ];
    
    for (const line of lines) {
        const lineLower = line.toLowerCase().trim();
        
        // Check if this line starts a recommendations section
        const isRecommendationStart = recommendationIndicators.some(pattern => pattern.test(lineLower));
        
        if (isRecommendationStart) {
            inRecommendationsSection = true;
            recommendations.push(line);
        } else if (inRecommendationsSection) {
            // Continue adding lines until we hit multiple empty lines
            if (line.trim() === '' && recommendations.length > 5) {
                break;
            }
            recommendations.push(line);
        }
    }
    
    return recommendations.length > 0 ? recommendations.join('\n') : analysisText;
}

/**
 * Extract data from analysis text using regex patterns
 */
function extractDataFromAnalysis(analysisText) {
    if (!analysisText) return {};
    
    const text = analysisText.toLowerCase();
    const extractedData = {};
    
    // Soil composition patterns
    const patterns = {
        sand: [
            /sand[:\s]*(\d+\.?\d*)%?/,
            /sand\s*content[:\s]*(\d+\.?\d*)%?/,
            /(\d+\.?\d*)%?\s*sand/,
            /-\s*sand[:\s]*(\d+\.?\d*)%?/
        ],
        clay: [
            /clay[:\s]*(\d+\.?\d*)%?/,
            /clay\s*content[:\s]*(\d+\.?\d*)%?/,
            /(\d+\.?\d*)%?\s*clay/,
            /-\s*clay[:\s]*(\d+\.?\d*)%?/
        ],
        silt: [
            /silt[:\s]*(\d+\.?\d*)%?/,
            /silt\s*content[:\s]*(\d+\.?\d*)%?/,
            /(\d+\.?\d*)%?\s*silt/,
            /-\s*silt[:\s]*(\d+\.?\d*)%?/
        ],
        ph: [
            /ph[:\s]*(\d+\.?\d*)/,
            /ph\s*level[:\s]*(\d+\.?\d*)/,
            /acidity[:\s]*(\d+\.?\d*)/
        ],
        nitrogen: [
            /nitrogen[:\s]*(\d+\.?\d*)/,
            /n[:\s]*(\d+\.?\d*)\s*(?:ppm|mg\/kg|%|g\/kg)/,
            /total\s*nitrogen[:\s]*(\d+\.?\d*)/,
            /-\s*nitrogen[:\s]*(\d+\.?\d*)/
        ],
        organic_carbon: [
            /organic\s*carbon[:\s]*(\d+\.?\d*)%?/,
            /soc[:\s]*(\d+\.?\d*)%?/,
            /carbon\s*content[:\s]*(\d+\.?\d*)%?/,
            /organic\s*matter[:\s]*(\d+\.?\d*)%?/
        ],
        cec: [
            /cec[:\s]*(\d+\.?\d*)/,
            /cation\s*exchange\s*capacity[:\s]*(\d+\.?\d*)/,
            /exchange\s*capacity[:\s]*(\d+\.?\d*)/
        ],
        phosphorus: [
            /phosphorus[:\s]*(\d+\.?\d*)/,
            /p[:\s]*(\d+\.?\d*)\s*(?:ppm|mg\/kg|g\/kg)/,
            /available\s*phosphorus[:\s]*(\d+\.?\d*)/
        ],
        potassium: [
            /potassium[:\s]*(\d+\.?\d*)/,
            /k[:\s]*(\d+\.?\d*)\s*(?:ppm|mg\/kg|g\/kg)/,
            /available\s*potassium[:\s]*(\d+\.?\d*)/
        ]
    };
    
    // Extract values using patterns
    for (const [dataType, patternList] of Object.entries(patterns)) {
        for (const pattern of patternList) {
            const match = text.match(pattern);
            if (match) {
                const value = parseFloat(match[1]);
                if (!isNaN(value)) {
                    extractedData[dataType] = value;
                    break; // Use first successful match
                }
            }
        }
    }
    
    return extractedData;
}

/**
 * Populate page with analysis data
 */
function populatePage(data) {
    const resultDiv = document.getElementById('result');
    const recommendationDiv = document.getElementById('recommendation-list');
    resultDiv.classList.remove('loading');
    
    // Extract data from analysis text
    const extractedData = extractDataFromAnalysis(data.analysis);
    
    // Merge extracted data with existing data
    const mergedData = {
        ...data,
        soil_properties: {
            ...data.soil_properties,
            ...extractedData
        }
    };
    
    // Populate analysis section
    displayText(resultDiv, data.analysis, 'No analysis available.');
    
    // Extract and display recommendations
    const recommendations = extractRecommendations(data.analysis);
    displayText(recommendationDiv, recommendations, 'No recommendations available.');
    
    updateFieldInformation(mergedData);
    generateCharts(mergedData);
}

/**
 * Update field information section
 */
function updateFieldInformation(data) {
    const fieldInfoDiv = document.getElementById('field-details');
    if (!fieldInfoDiv) return;

    const soil = data.soil_properties || {};
    const climate = (data.climate_conditions && data.climate_conditions.summary) || {};
    const fieldInfo = data.field_info || {};

    // Use extracted data or fallback to original data
    const items = {
        "Field Name": fieldInfo.name || "Unknown",
        "Area (ha)": fieldInfo.area ? fieldInfo.area.toFixed(2) : 'N/A',
        "pH Level": soil.ph ? soil.ph.toFixed(1) : 'N/A',
        "Sand %": soil.sand ? soil.sand.toFixed(1) : 'N/A',
        "Clay %": soil.clay ? soil.clay.toFixed(1) : 'N/A',
        "Silt %": soil.silt ? soil.silt.toFixed(1) : 'N/A'
    };
    
    let html = '';
    for (const [key, value] of Object.entries(items)) {
        html += `
            <div class="info-item">
                <h3>${key}</h3>
                <p>${value}</p>
            </div>`;
    }
    fieldInfoDiv.innerHTML = html;
}

/**
 * Generate charts for soil composition and nutrients
 */
function generateCharts(data) {
    // Destroy existing charts if they exist
    if (nutrientChart) nutrientChart.destroy();
    if (compositionChart) compositionChart.destroy();

    const soil = data.soil_properties || {};
    
    // Soil Composition Chart (Doughnut)
    const compCtx = document.getElementById('compositionChart')?.getContext('2d');
    if (compCtx) {
        const sand = getNumericValue(soil, 'sand', 0);
        const clay = getNumericValue(soil, 'clay', 0);
        const silt = getNumericValue(soil, 'silt', 0);
        
        // Calculate percentages if total is not 100
        const total = sand + clay + silt;
        const normalizedData = total > 0 ? [
            (sand / total) * 100,
            (clay / total) * 100,
            (silt / total) * 100
        ] : [33.3, 33.3, 33.3]; // Default if no data
        
        compositionChart = new Chart(compCtx, {
            type: 'doughnut',
            data: {
                labels: ['Sand %', 'Clay %', 'Silt %'],
                datasets: [{
                    data: normalizedData,
                    backgroundColor: ['#f4a261', '#e76f51', '#2a9d8f'],
                    borderColor: '#1a2332',
                    borderWidth: 4
                }]
            },
            options: { 
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#e8eaed', font: { size: 12 } }
                    },
                    title: {
                        display: true,
                        text: 'Soil Texture Composition',
                        color: '#e8eaed',
                        font: { size: 14, weight: 'bold' }
                    }
                }
            }
        });
    }

    // Nutrient Chart (Bar)
    const nutrientCtx = document.getElementById('nutrientChart')?.getContext('2d');
    if (nutrientCtx) {
        const nutrients = {
            'N (g/kg)': getNumericValue(soil, 'nitrogen') || getNumericValue(soil, 'total_nitrogen'),
            'P (g/kg)': getNumericValue(soil, 'phosphorus') || getNumericValue(soil, 'total_phosphorus'),
            'K (g/kg)': getNumericValue(soil, 'potassium') || getNumericValue(soil, 'total_potassium'),
            'Org C (%)': getNumericValue(soil, 'organic_carbon') || getNumericValue(soil, 'soc'),
            'CEC': getNumericValue(soil, 'cec')
        };
        
        // Filter out zero values for cleaner display
        const nonZeroNutrients = Object.entries(nutrients).filter(([_, value]) => value > 0);
        
        // If no data, show placeholder
        const labels = nonZeroNutrients.length > 0 
            ? nonZeroNutrients.map(([label, _]) => label)
            : ['N', 'P', 'K', 'Org C', 'CEC'];
        const values = nonZeroNutrients.length > 0 
            ? nonZeroNutrients.map(([_, value]) => value)
            : [0, 0, 0, 0, 0];
        
        nutrientChart = new Chart(nutrientCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Value',
                    data: values,
                    backgroundColor: ['#4ade80', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6'],
                    borderColor: '#1a2332',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Key Soil Nutrients',
                        color: '#e8eaed',
                        font: { size: 14, weight: 'bold' }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#cbd5e0', font: { size: 11 } },
                        grid: { color: 'rgba(203, 213, 224, 0.1)' }
                    },
                    x: {
                        ticks: { color: '#cbd5e0', font: { size: 10 } },
                        grid: { display: false }
                    }
                }
            }
        });
    }
}

/**
 * Helper function to safely get numeric values
 */
function getNumericValue(obj, key, fallback = 0) {
    if (!obj) return fallback;
    const value = obj[key];
    return (typeof value === 'number' && !isNaN(value)) ? value : fallback;
}

/**
 * Display error message
 */
function displayError(errorMessage) {
    const resultDiv = document.getElementById('result');
    resultDiv.classList.remove('loading');
    resultDiv.classList.add('error');
    resultDiv.innerHTML = `
        <div style="text-align: center; padding: 2rem;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f87171; margin-bottom: 1rem;"></i>
            <h3 style="color: #f87171; margin-bottom: 1rem;">Analysis Error</h3>
            <p style="color: #cbd5e0; margin-bottom: 1.5rem;">${errorMessage}</p>
            <button onclick="location.reload()" style="padding: 0.75rem 1.5rem; background: #4ade80; color: #0f1419; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem;">
                <i class="fas fa-redo"></i> Retry Analysis
            </button>
        </div>
    `;
}

/**
 * Setup action buttons
 */
function setupActionButtons() {
    const downloadBtn = document.getElementById('download-report');
    const shareBtn = document.getElementById('share-report');
    
    if (downloadBtn) {
        downloadBtn.addEventListener('click', () => {
            alert('Download feature coming soon. This will generate a PDF report of your field analysis.');
        });
    }
    
    if (shareBtn) {
        shareBtn.addEventListener('click', () => {
            alert('Share feature coming soon. This will allow you to share your analysis via email or link.');
        });
    }
}
    </script>
</body>
</html>
