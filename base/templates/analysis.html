{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Field Analysis</title>
    <link rel="stylesheet" href="{% static 'css/analysis.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        /* This is the CSS you provided, which is well-written and defines the page style. */
        /* It creates the black and green theme. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #e8eaed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #2d3748;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 2px 4px rgba(74, 222, 128, 0.3);
        }

        .logo .fa-leaf {
            font-size: 2rem;
            color: #4ade80;
        }

        .analysis-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            align-items: flex-start;
        }

        .main-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: linear-gradient(135deg, #1a2332, #243447);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #2d3748;
        }

        .card-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2d3748;
        }

        .card-header i {
            font-size: 1.5rem;
            color: #4ade80;
            width: 30px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e8eaed;
        }
        
        #result, #recommendation-list {
            padding: 10px;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #cbd5e0;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            overflow: auto;
            max-height: 450px;
            position: relative;
        }

        #result.loading {
            background: linear-gradient(90deg, #1a2332 25%, #243447 50%, #1a2332 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            color: #a3e635;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #2d3748;
            border-top: 5px solid #4ade80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result.error {
            color: #f87171;
            background: #2d1e1e;
            border: 1px solid #f5c6cb;
        }

        #field-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: #4ade80;
        }

        .info-item h3 {
            font-size: 0.9rem;
            color: #a3e635;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item p {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e8eaed;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .action-btn {
            padding: 15px;
            border-radius: 10px;
            border: none;
            color: #e8eaed;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .download-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .share-btn { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        .charts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chart-wrapper { height: 280px; }

        @media (max-width: 1024px) {
            .analysis-content { grid-template-columns: 1fr; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a2332; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #4a5568, #4ade80); border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <h1>Agri-Vision Analysis</h1>
            </div>
        </header>

        <div class="analysis-content">
            <div class="main-column">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-file-alt"></i>
                        <h2>Analysis</h2>
                    </div>
                    <div id="result" class="loading">
                        <div class="loading-spinner"></div>
                        <p>Running field analysis...</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-lightbulb"></i>
                        <h2>Recommendations</h2>
                    </div>
                    <div id="recommendation-list"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-map-marker-alt"></i>
                        <h2>Field Information</h2>
                    </div>
                    <div id="field-details"></div>
                </div>

                <div class="card">
                     <div class="card-header">
                        <i class="fas fa-chart-pie"></i>
                        <h2>Soil Composition</h2>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="compositionChart"></canvas>
                    </div>
                </div>
                
                <div class="card">
                     <div class="card-header">
                        <i class="fas fa-vial"></i>
                        <h2>Nutrient Levels</h2>
                    </div>
                    <div class="chart-wrapper">
                         <canvas id="nutrientChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-cogs"></i>
                        <h2>Actions</h2>
                    </div>
                    <div class="actions">
                        <button id="download-report" class="action-btn download-btn"><i class="fas fa-download"></i> Download Report</button>
                        <button id="share-report" class="action-btn share-btn"><i class="fas fa-share-alt"></i> Share Report</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store chart instances
        let nutrientChart = null;
        let compositionChart = null;

        // --- Configuration for Charts ---
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: '#e8eaed', font: { size: 14 } }
                }
            },
            scales: {
                y: {
                    ticks: { color: '#cbd5e0', font: { size: 12 } },
                    grid: { color: 'rgba(203, 213, 224, 0.1)' }
                },
                x: {
                    ticks: { color: '#cbd5e0', font: { size: 12 } },
                    grid: { color: 'rgba(203, 213, 224, 0.1)' }
                }
            }
        };

        // --- Main Logic on Page Load ---
        document.addEventListener('DOMContentLoaded', function () {
            // Fetch data asynchronously instead of embedding it directly
            fetch(window.location.pathname, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Network response was not ok: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success && data.result) {
                    // Check if analysis is available
                    if (data.result.analysis) {
                        populatePage(data.result);
                    } else {
                        throw new Error('Analysis is not available. Please try again later.');
                    }
                } else {
                    throw new Error(data.error || 'Failed to retrieve analysis data.');
                }
            })
            .catch(error => {
                console.error("Failed to fetch analysis:", error);
                displayError(error.message);
            });

            setupActionButtons();
        });

        // --- Data Population Functions ---
        
        function populatePage(data) {
            const resultDiv = document.getElementById('result');
            const recommendationDiv = document.getElementById('recommendation-list');
            resultDiv.classList.remove('loading');
            
            // Populate analysis section
            displayText(resultDiv, data.analysis, 'No analysis available.');
            
            // Extract recommendations from the analysis text
            const recommendations = extractRecommendations(data.analysis);
            displayText(recommendationDiv, recommendations, 'No recommendations available.');
            
            updateFieldInformation(data);
            generateCharts(data);
        }

        function extractRecommendations(analysisText) {
            if (!analysisText) return '';
            
            const lines = analysisText.split('\n');
            const recommendations = [];
            let inRecommendationsSection = false;

            for (const line of lines) {
                // Check for a heading that indicates recommendations
                if (line.match(/^1\. Top 5 suitable crops/)) {
                    inRecommendationsSection = true;
                    recommendations.push(line);
                } else if (inRecommendationsSection && line.match(/^2\. Climate risks/)) {
                     recommendations.push(line);
                } else if (inRecommendationsSection && line.match(/^3\. Planting timing/)) {
                     recommendations.push(line);
                } else if (inRecommendationsSection && line.match(/^4\. Irrigation strategy/)) {
                     recommendations.push(line);
                } else if (inRecommendationsSection) {
                    // If we're inside the section, add the line
                    recommendations.push(line);
                }
            }
            
            // This is a simple regex-based extraction; a more robust approach might be needed
            // depending on the LLM's output format.
            const recommendationPattern = /(1\. Top 5 suitable crops with soil-climate synergies.*|2\. Climate risks and mitigations.*|3\. Planting timing recommendations.*|4\. Irrigation strategy based on water retention and precipitation.*)/s;
            const match = analysisText.match(recommendationPattern);
            
            if (match) {
                return match[1];
            }

            return '';
        }

        function displayText(element, text, fallbackText) {
            if (element) {
                element.innerHTML = text ? `<p>${text.replace(/\n/g, '<br>')}</p>` : `<p>${fallbackText}</p>`;
            }
        }
        
        function displayError(errorMessage) {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('loading');
            resultDiv.classList.add('error');
            resultDiv.innerHTML = `<strong><i class="fas fa-exclamation-triangle"></i> Error:</strong><br>${errorMessage}`;
        }

        function updateFieldInformation(data) {
            const fieldInfoDiv = document.getElementById('field-details');
            if (!fieldInfoDiv) return;

            const soil = data.soil_properties || {};
    const climate = (data.climate_conditions && data.climate_conditions.summary) || {};

    // Extract pH from data.analysis string if available
    let phMatch = null;
    if (data.analysis) {
        const match = data.analysis.match(/pH:\s*([\d.]+)/);
        if (match) {
            phMatch = match[1];
        }
    }
    let sandMatch=null;
    if (data.analysis) {
        const sand = data.analysis.match(/sand: \s*([\d.]+)/);
        if (sand) {
            sandMatch = match[1];
        }
    }
    let clayMatch = null;
    if (data.analysis) {
        const clay = data.analysis.match(/clay: \s*([\d.]+)/);
        if (clay) {
            clayMatch = match[1];
        }
    }

    const items = {
        "Field ID": "{{ id }}", // This is okay — Django will insert the ID from backend
        "pH": phMatch ?? soil.phh2o ?? 'N/A',
        "Area": "{{ area }} ha", // Assuming you pass `area` in context
        "Dominant Weather": climate.dominant_weather ?? 'N/A',
        "Avg Max Temp": climate.avg_max_temp ? `${climate.avg_max_temp.toFixed(1)} °C` : 'N/A',
        "Avg Min Temp": climate.avg_min_temp ? `${climate.avg_min_temp.toFixed(1)} °C` : 'N/A',
    };
            
            let html = '';
            for (const [key, value] of Object.entries(items)) {
                html += `
                    <div class="info-item">
                        <h3>${key}</h3>
                        <p>${value}</p>
                    </div>`;
            }
            fieldInfoDiv.innerHTML = html;
        }

        function generateCharts(data) {
            if (nutrientChart) nutrientChart.destroy();
            if (compositionChart) compositionChart.destroy();

            const soil = data.soil_properties || {};
            
            // Soil Composition Chart (Pie)
            const compCtx = document.getElementById('compositionChart')?.getContext('2d');
            if (compCtx) {
                const sand = sandMatch ?? soil.sand ?? 0;
                const clay = clayMatch ?? soil.clay ?? 0;
                const silt = soil.silt ?? 0;
                
                compositionChart = new Chart(compCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Sand %', 'Clay %', 'Silt %'],
                        datasets: [{
                            data: [sand, clay, silt],
                            backgroundColor: ['#f4a261', '#e76f51', '#2a9d8f'],
                            borderColor: '#1a2332',
                            borderWidth: 4
                        }]
                    },
                    options: { 
                        ...chartOptions, 
                        scales: {},
                        plugins: {
                            ...chartOptions.plugins,
                            title: {
                                display: true,
                                text: 'Soil Composition',
                                color: '#e8eaed',
                                font: { size: 16 }
                            }
                        }
                    }
                });
            }

            // Nutrient Chart (Bar)
            const nutrientCtx = document.getElementById('nutrientChart')?.getContext('2d');
            if (nutrientCtx) {
                nutrientChart = new Chart(nutrientCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Nitrogen', 'CEC', 'Organic Carbon'],
                        datasets: [{
                            label: 'Value',
                            data: [soil.nitrogen ?? 0, soil.cec ?? 0, soil.soc ?? 0],
                            backgroundColor: ['#4ade80', '#3b82f6', '#f59e0b']
                        }]
                    },
                    options: {
                        ...chartOptions,
                        plugins: {
                            ...chartOptions.plugins,
                            title: {
                                display: true,
                                text: 'Key Nutrient Levels',
                                color: '#e8eaed',
                                font: { size: 16 }
                            }
                        }
                    }
                });
            }
        }
        
        function setupActionButtons() {
            document.getElementById('download-report')?.addEventListener('click', () => alert('Download feature coming soon.'));
            document.getElementById('share-report')?.addEventListener('click', () => alert('Share feature coming soon.'));
        }
    </script>
</body>
</html>
